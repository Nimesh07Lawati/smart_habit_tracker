name: Flutter CI

# Trigger the workflow on push to main branch and pull requests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  # Job 1: Build and Test on Ubuntu (Linux)
  build-test-linux:
    name: Build & Test on Ubuntu
    runs-on: ubuntu-latest
    
    steps:
      # Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      
      # Install dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Check code formatting
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      
      # Static analysis
      - name: Analyze code
        run: flutter analyze
      
      # Run tests with coverage
      - name: Run tests
        run: flutter test --coverage
      
      # Upload coverage to Codecov (optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
  
  # Job 2: Build Android APK (optional)
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-test-linux
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
  
  # Job 3: Build Web (optional)
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: build-test-linux
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Enable web
        run: flutter config --enable-web
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build web
        run: flutter build web --release
      
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web